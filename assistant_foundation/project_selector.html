<script>(()=>{const root=document.createElement('div');root.className='section';const label=document.createElement('h3');label.id='activeChatProject';label.textContent='Proje kontrol ediliyor…';root.append(label);const input=document.createElement('input');input.placeholder='Proje adı · Örn. ZİTAR';input.setAttribute('aria-label','Proje adı');input.maxLength=100;root.append(input);const open=document.createElement('button');open.className='btn';open.textContent='Projeyi aç';const privateButton=document.createElement('button');privateButton.className='btn';privateButton.textContent='Özel sohbete dön';root.append(open,privateButton);const msg=document.createElement('p');root.append(msg);document.getElementById('chatView').prepend(root);async function change(question){open.disabled=privateButton.disabled=true;try{const r=await fetch('/api/chat-proxy/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,session_id:zitarSession})});const d=await r.json();if(!r.ok||d.route==='MEMORY_INPUT_ERROR')throw Error(d.answer||'Proje açılamadı');msg.textContent=d.answer;sharedHistorySignature=null;await restoreZitarHistory();}catch(e){msg.textContent=e.message}finally{open.disabled=privateButton.disabled=false}}open.onclick=()=>{const name=input.value.trim();if(name)change('Ortak proje seç: '+name);else msg.textContent='Önce proje adını yaz.';};privateButton.onclick=()=>change('Özel sohbet hafızasına dön');})();</script>
